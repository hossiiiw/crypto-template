<!DOCTYPE html>
<html lang="en" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./style/index.css">
    <title>Login</title>
</head>

<body>
    <form class="z-10 w-full h-screen flex items-center justify-center bg-[#0F0F1A] ">
        <div class=" bg-[#1B1B3B] w-[70%] h-[80%] rounded-[10px] flex flex-row items-center justify-between gap-5 p-4">
            <div class="sing-in-gra w-[50%] h-full rounded-[10px]  flex items-center justify-center">
                <img src="./assets/Group 7.png" alt="">
            </div>
            <!--  -->
            <div class="w-[50%] flex flex-col items-center justify-center gap-4">
                <img src="./assets/Group 6.png" />
                <div class="flex flex-col items-center justify-center w-full">
        
                    <input type="text" placeholder="شماره موبایل"
                        class="w-[70%] bg-[#0A0F2F] text-white border-[1px] border-[#8B5CF6] p-3 m-2 rounded-[40px] ">
                    <input type="password" placeholder="رمز عبور"
                        class="w-[70%] bg-[#0A0F2F] text-white border-[1px] border-[#8B5CF6] p-3 m-2 rounded-[40px] ">
                    <button class="w-[70%] bg-[#8B5CF6] text-white p-3 m-2 rounded-[40px] hover:bg-[#7D4AE8]">ورود به
                        حساب کاربری</button>
                    <p class="text-white m-2">حساب کاربری ندارید؟ <a href="sign-up.html"
                            class="text-[#8B5CF6] hover:underline">ثبت نام کنید</a></p>
                </div>
            </div>

        </div>
    </form>
</body>

</html>
